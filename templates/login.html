{% extends 'base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card"><div class="card-body p-4">
  <h1 class="h4">Sign in</h1>
  <p class="text-muted">Examination Management Portal</p>
  <form method="post">
    <div class="mb-3"><label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" required autofocus></div>
    <div class="mb-3"><label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" required></div>
    <button class="btn btn-primary w-100">Sign in</button>
  </form>
  <hr>
  <div class="text-center small">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></div>
</div></div>
{% endblock %}
