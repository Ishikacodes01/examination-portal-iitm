{% extends 'base.html' %}
{% block title %}Edit slot{% endblock %}
{% block content %}
<h1 class="page-title">Edit slot #{{ slot.id }}</h1>
<p class="text-muted">{{ slot.exam.name }}</p>
<div class="card" style="max-width: 640px"><div class="card-body">
  <form method="post" class="row g-3">
    <div class="col-md-6"><label class="form-label">Date</label><input type="date" min="{{ today }}" name="date" class="form-control" value="{{ f.get('date', '') }}" required></div>
    <div class="col-md-6"><label class="form-label">Capacity</label><input type="number" min="1" name="capacity" class="form-control" value="{{ f.get('capacity', '') }}" required></div>
    <div class="col-md-6"><label class="form-label">Start time</label><input type="time" name="start_time" class="form-control" value="{{ f.get('start_time', '') }}" required></div>
    <div class="col-md-6"><label class="form-label">End time</label><input type="time" name="end_time" class="form-control" value="{{ f.get('end_time', '') }}" required></div>
    <div class="col-12"><label class="form-label">Venue / link</label><input name="venue" class="form-control" value="{{ f.get('venue') or '' }}"></div>
    <div class="col-12"><button class="btn btn-primary">Save slot</button>
      <a class="btn btn-link" href="{{ url_for('examiner.exam_slots', eid=slot.exam_id) }}">Cancel</a></div>
  </form>
</div></div>
{% endblock %}
