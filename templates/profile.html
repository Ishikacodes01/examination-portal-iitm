{% extends 'base.html' %}
{% block title %}Edit profile{% endblock %}
{% block content %}
<h1 class="page-title">Edit profile</h1>
<div class="card" style="max-width: 560px"><div class="card-body">
  <form method="post">
    <div class="mb-3"><label class="form-label">Full name</label>
      <input name="name" class="form-control" value="{{ current_user.name }}" required></div>
    <div class="mb-3"><label class="form-label">Email</label>
      <input class="form-control" value="{{ current_user.email }}" disabled></div>
    <div class="mb-3"><label class="form-label">Contact number</label>
      <input name="contact" class="form-control" value="{{ current_user.contact or '' }}"></div>
    {% if current_user.role == 'student' %}
    <div class="mb-3"><label class="form-label">Roll number</label>
      <input name="roll_no" class="form-control" value="{{ current_user.roll_no or '' }}"></div>
    {% elif current_user.role == 'examiner' %}
    <div class="mb-3"><label class="form-label">Department</label>
      <input name="department" class="form-control" value="{{ current_user.examiner_profile.department or '' }}"></div>
    {% endif %}
    <div class="mb-3"><label class="form-label">New password <span class="text-muted small">(leave empty to keep the old one)</span></label>
      <input type="password" name="password" class="form-control" minlength="6"></div>
    <button class="btn btn-primary">Save changes</button>
  </form>
</div></div>
{% endblock %}
