{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card"><div class="card-body p-4">
  <h1 class="h4 mb-3">Create an account</h1>
  <form method="post">
    <div class="mb-3">
      <label class="form-label d-block">I am a</label>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="role" id="r1" value="student" {{ 'checked' if f.get('role', 'student') == 'student' }}>
        <label class="form-check-label" for="r1">Student</label></div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="role" id="r2" value="examiner" {{ 'checked' if f.get('role') == 'examiner' }}>
        <label class="form-check-label" for="r2">Examiner</label></div>
    </div>
    <div class="mb-3"><label class="form-label">Full name</label>
      <input name="name" class="form-control" value="{{ f.get('name', '') }}" required></div>
    <div class="mb-3"><label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" value="{{ f.get('email', '') }}" required></div>
    <div class="mb-3"><label class="form-label">Password (6+ characters)</label>
      <input type="password" name="password" class="form-control" minlength="6" required></div>
    <div class="mb-3"><label class="form-label">Contact number</label>
      <input name="contact" class="form-control" value="{{ f.get('contact', '') }}"></div>
    <div class="row g-2 mb-3">
      <div class="col"><label class="form-label">Roll number <span class="text-muted small">(students)</span></label>
        <input name="roll_no" class="form-control" value="{{ f.get('roll_no', '') }}"></div>
      <div class="col"><label class="form-label">Department <span class="text-muted small">(examiners)</span></label>
        <input name="department" class="form-control" value="{{ f.get('department', '') }}"></div>
    </div>
    <button class="btn btn-primary w-100">Register</button>
  </form>
  <hr>
  <div class="text-center small">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></div>
</div></div>
{% endblock %}
