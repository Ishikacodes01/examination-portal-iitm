{% extends 'base.html' %}
{% block title %}{{ 'Edit' if exam else 'New' }} examination{% endblock %}
{% block content %}
<h1 class="page-title">{{ 'Edit examination' if exam else 'New examination' }}</h1>
<div class="card" style="max-width: 760px"><div class="card-body">
  <form method="post">
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label">Course</label>
        <select name="course_id" class="form-select" required>
          <option value="">Choose a course</option>
          {% for c in courses %}<option value="{{ c.id }}" {{ 'selected' if f.get('course_id')|string == c.id|string }}>{{ c.code }} - {{ c.name }}</option>{% endfor %}
        </select></div>
      <div class="col-md-6"><label class="form-label">Examination name</label>
        <input name="name" class="form-control" value="{{ f.get('name', '') }}" required></div>
      <div class="col-md-4"><label class="form-label">Type</label>
        <select name="exam_type" class="form-select">
          {% for t in EXAM_TYPES %}<option {{ 'selected' if f.get('exam_type') == t }}>{{ t }}</option>{% endfor %}
        </select></div>
      <div class="col-md-4"><label class="form-label">Duration (minutes)</label>
        <input type="number" min="1" name="duration" class="form-control" value="{{ f.get('duration', '') }}" required></div>
      <div class="col-md-4"><label class="form-label">Maximum marks</label>
        <input type="number" min="1" step="any" name="max_marks" class="form-control" value="{{ f.get('max_marks')|num if f.get('max_marks') is number else f.get('max_marks', '') }}" required></div>
      <div class="col-md-6"><label class="form-label">Slot creation starts</label>
        <input type="date" name="slot_creation_start" class="form-control" value="{{ f.get('slot_creation_start', '') }}" required></div>
      <div class="col-md-6"><label class="form-label">Slot creation ends</label>
        <input type="date" name="slot_creation_end" class="form-control" value="{{ f.get('slot_creation_end', '') }}" required></div>
      <div class="col-md-6"><label class="form-label">Student booking starts</label>
        <input type="date" name="booking_start" class="form-control" value="{{ f.get('booking_start', '') }}" required></div>
      <div class="col-md-6"><label class="form-label">Student booking ends (deadline)</label>
        <input type="date" name="booking_end" class="form-control" value="{{ f.get('booking_end', '') }}" required></div>
      <div class="col-12"><label class="form-label">Instructions for students</label>
        <textarea name="instructions" rows="3" class="form-control">{{ f.get('instructions') or '' }}</textarea></div>
    </div>
    <div class="mt-3"><button class="btn btn-primary">Save examination</button>
      <a class="btn btn-link" href="{{ url_for('admin.exams') }}">Cancel</a></div>
  </form>
</div></div>
{% endblock %}
